<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dfe9f5">
<meta name="color-scheme" content="light">
<title>投球砸墙 · Ball &amp; Bricks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23ff6b57'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #dfe9f5; }
  :root { color-scheme: light; }
  body {
    background: #dfe9f5;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #24425c;
    user-select: none;
  }
  canvas { display: block; cursor: crosshair; touch-action: none; }

  #safeTop {
    position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top);
    background: #dfe9f5; z-index: 20; pointer-events: none;
  }

  .glass {
    background: rgba(255, 255, 255, .72);
    border: 1px solid rgba(150, 180, 210, .4);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(40, 70, 100, .12);
  }

  #hud {
    position: fixed; top: max(20px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); right: max(20px, env(safe-area-inset-right));
    display: flex; justify-content: space-between; align-items: center;
    opacity: 0; transform: translateY(-8px); transition: .25s ease; pointer-events: none;
  }
  body.playing #hud { opacity: 1; transform: none; }
  .stat {
    padding: 10px 16px; border-radius: 14px; font-size: 12px;
    letter-spacing: .5px; color: #5b7690;
  }
  .stat b { font-size: 20px; font-weight: 700; color: #24425c; margin-right: 3px; }
  .stat i { font-style: normal; }
  .stat.big b { color: #ff7a59; }
  #throws { color: #24425c; }
  .stats { display: flex; align-items: baseline; gap: 6px; }
  .statGroup { display: inline-flex; align-items: baseline; gap: 3px; }
  .statSep { color: rgba(120, 150, 180, .5); }
  .hudBtn {
    pointer-events: auto; cursor: pointer; appearance: none; -webkit-appearance: none;
    font-family: inherit; font-size: 12px; letter-spacing: 1px; color: #5b7690;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .hudBtn:hover { background: rgba(255, 255, 255, .92); color: #24425c; }
  .hudBtn:active { transform: scale(.96); }

  #hud.compact { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); }
  #hud.compact .stat { padding: 8px 10px; border-radius: 12px; font-size: 11px; }
  #hud.compact .stat b { font-size: 17px; }
  #hud.compact .hudBtn { font-size: 11px; letter-spacing: .5px; }
  #hud.narrow { top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); }
  #hud.narrow .stat { padding: 6px 8px; border-radius: 10px; font-size: 10px; }
  #hud.narrow .stat b { font-size: 15px; }
  #hud.narrow .hudBtn { font-size: 10px; letter-spacing: 0; }

  #statsWrap {
    position: fixed; left: max(10px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); z-index: 4;
    padding: 7px 10px; border-radius: 12px; font-size: 11px; gap: 4px;
    opacity: 0; transform: translateY(8px); transition: .25s ease; pointer-events: none;
  }
  body.playing #statsWrap { opacity: 1; transform: none; }
  #statsWrap b { font-size: 16px; }
  #statsWrap .statGroup { gap: 2px; }
  #statsWrap.compact { left: max(8px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); padding: 6px 8px; border-radius: 10px; font-size: 10px; gap: 3px; }
  #statsWrap.compact b { font-size: 15px; }
  #statsWrap.narrow { left: max(6px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); padding: 5px 7px; border-radius: 9px; font-size: 9px; gap: 2px; }
  #statsWrap.narrow b { font-size: 14px; }

  #powerWrap {
    position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: 240px; padding: 8px 10px 10px; border-radius: 14px;
    opacity: 0; transition: opacity .12s ease; pointer-events: none;
  }
  #powerWrap.on { opacity: 1; }
  #powerLabel {
    display: flex; justify-content: space-between; font-size: 10px;
    letter-spacing: 2px; color: #6b849c; margin-bottom: 6px;
  }
  #powerTrack {
    height: 8px; border-radius: 999px; overflow: hidden;
    background: rgba(120, 150, 180, .22);
  }
  #powerFill {
    height: 100%; width: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #ffd166, #ff8c69 55%, #ff5a5f);
    transform: scaleX(0); transform-origin: left center;
  }

  #sizePanel {
    position: fixed; left: max(10px, env(safe-area-inset-left)); bottom: calc(60px + env(safe-area-inset-bottom)); z-index: 5;
    width: 38px; padding: 8px 4px; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  body.playing #sizePanel { opacity: 1; pointer-events: auto; }
  #sizeLabel { font-size: 10px; font-weight: 600; color: #24425c; }
  #sizeTrack { position: relative; width: 22px; height: 150px; }
  #sizeSlider {
    position: absolute; left: 50%; top: 50%;
    width: 150px; height: 22px;
    transform: translate(-50%, -50%) rotate(-90deg);
    accent-color: #ff7a59; cursor: pointer;
  }

  #toolWrap {
    position: fixed; top: calc(74px + env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); z-index: 6;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  body.playing #toolWrap { opacity: 1; pointer-events: auto; }
  #toolBtn {
    width: 46px; height: 46px; padding: 0; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
  }
  #toolBtn:hover { background: rgba(255, 255, 255, .95); }
  #toolBtn canvas { width: 100%; height: 100%; display: block; }
  #toolMenu {
    position: absolute; top: calc(100% + 8px); left: 0; width: 150px;
    padding: 6px; border-radius: 14px; display: none; flex-direction: column; gap: 6px;
  }
  #toolWrap.open #toolMenu { display: flex; }
  .toolRow { display: flex; gap: 6px; }
  .toolItem {
    flex: 0 0 66px; width: 66px; height: 66px; min-width: 0; padding: 0;
    border-radius: 16px; overflow: hidden;
    border: 2px solid transparent; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .toolItem:hover { background: rgba(255, 255, 255, .75); }
  .toolItem.active { border-color: #ff7a59; background: rgba(255, 122, 89, .12); }
  .toolItem canvas { width: 100%; height: 100%; min-width: 0; display: block; }

  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background: rgba(223, 233, 245, .52); backdrop-filter: blur(7px);
    transition: opacity .22s ease; z-index: 10;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    position: relative;
    width: min(440px, calc(100vw - 48px)); padding: 34px 36px 30px; border-radius: 26px;
    text-align: center; background: #fff;
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow: 0 24px 70px rgba(40, 70, 100, .2);
    max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain;
  }
  #fullBtn {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    padding: 6px 10px; border-radius: 10px; cursor: pointer; font-family: inherit;
    font-size: 11px; letter-spacing: .5px; color: #5b7690;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  #fullBtn:hover { background: rgba(255, 255, 255, .95); color: #24425c; }
  #fullBtn:active { transform: scale(.96); }
  .card h1 { font-size: 30px; font-weight: 700; letter-spacing: 5px; color: #24425c; }
  .card .en { margin-top: 7px; font-size: 10px; letter-spacing: 5px; color: #8ba6bf; }
  .card .desc { margin-top: 22px; font-size: 13px; line-height: 2; color: #5b7690; }
  .card .desc b { color: #ff7a59; font-weight: 600; }
  .scenes {
    margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .sceneBtn {
    appearance: none; -webkit-appearance: none; text-align: left;
    padding: 16px 15px 14px; border-radius: 18px; cursor: pointer;
    border: 1px solid rgba(150, 180, 210, .65);
    background: rgba(255, 255, 255, .96); font-family: inherit; color: #24425c;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .sceneBtn:hover:not(:disabled) {
    transform: translateY(-2px); background: rgba(255, 255, 255, .96);
    border-color: #ff7a59; box-shadow: 0 10px 22px rgba(255, 122, 89, .16);
  }
  .sceneBtn:active:not(:disabled) { transform: translateY(0) scale(.98); }
  .sceneBtn:disabled { opacity: .45; cursor: wait; }
  .sceneName { display: block; font-size: 17px; font-weight: 700; letter-spacing: 2px; }
  .sceneDesc { display: block; margin-top: 6px; font-size: 11px; line-height: 1.6; color: #7b95ad; }
  .card .foot { margin-top: 18px; font-size: 11px; letter-spacing: 1px; color: #93aabd; }
  .card .foot em { font-style: normal; color: #ff7a59; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
  }
}
</script>
</head>
<body>
  <div id="safeTop"></div>
  <div id="hud">
    <button id="homeBtn" class="stat glass hudBtn" type="button">返回主页</button>
    <button id="resetBtn" class="stat glass hudBtn" type="button">重置</button>
  </div>

  <div id="statsWrap" class="stat big glass stats">
    <span class="statGroup"><b id="fallen">0</b><span>/ <i id="total">0</i> 倒下</span></span>
    <span class="statSep">·</span>
    <span class="statGroup"><b id="throws">0</b><span>次投掷</span></span>
  </div>

  <div id="powerWrap" class="glass">
    <div id="powerLabel"><span>力度</span><span id="powerPct">0%</span></div>
    <div id="powerTrack"><div id="powerFill"></div></div>
  </div>

  <div id="sizePanel" class="glass">
    <span id="sizeLabel">32</span>
    <div id="sizeTrack">
      <input id="sizeSlider" type="range" min="0" max="1000" step="1" value="274" aria-label="球大小">
    </div>
  </div>

  <div id="toolWrap">
    <button id="toolBtn" class="glass" type="button" aria-label="工具" title="工具">
      <canvas id="toolPreview" width="96" height="96"></canvas>
    </button>
    <div id="toolMenu" class="glass">
      <div class="toolRow">
        <button class="toolItem active" type="button" data-projectile="ball" aria-label="红色球" title="红色球">
          <canvas class="toolPreview" width="128" height="128"></canvas>
        </button>
        <button class="toolItem" type="button" data-projectile="brick" aria-label="砖头" title="砖头">
          <canvas class="toolPreview" width="128" height="128"></canvas>
        </button>
      </div>
      <div class="toolRow">
        <button class="toolItem" type="button" data-projectile="can" aria-label="罐子" title="罐子">
          <canvas class="toolPreview" width="128" height="128"></canvas>
        </button>
        <button class="toolItem" type="button" data-projectile="bomb" aria-label="炸弹" title="炸弹">
          <canvas class="toolPreview" width="128" height="128"></canvas>
        </button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="card">
      <button id="fullBtn" class="glass" type="button">全屏</button>
      <h1 id="ovTitle">投球砸墙</h1>
      <div class="en">BALL &amp; BRICKS</div>
      <p class="desc" id="ovDesc">正在加载物理引擎…</p>
      <div class="scenes">
        <button class="sceneBtn" type="button" data-scene="wall" disabled>
          <span class="sceneName">砖墙</span>
          <span class="sceneDesc">9 列 × 40 行<br>经典拆墙</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="tower" disabled>
          <span class="sceneName">高塔</span>
          <span class="sceneDesc">竖砖与横砖交替<br>15 组直上高空</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="taper" disabled>
          <span class="sceneName">锥塔</span>
          <span class="sceneDesc">横竖交错<br>层层收窄</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="ring" disabled>
          <span class="sceneName">圆塔</span>
          <span class="sceneDesc">环砖错缝<br>层层垒高</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="flat" disabled>
          <span class="sceneName">圆环</span>
          <span class="sceneDesc">平放围环<br>短轴竖直 · 错缝垒高</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="cans" disabled>
          <span class="sceneName">罐塔</span>
          <span class="sceneDesc">金属罐堆<br>锥形收窄</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="taperCans" disabled>
          <span class="sceneName">罐锥塔</span>
          <span class="sceneDesc">砖格塞罐<br>锥形收窄</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="towerCans" disabled>
          <span class="sceneName">高塔罐</span>
          <span class="sceneDesc">8 砖宽<br>格内塞罐</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="framedWall" disabled>
          <span class="sceneName">框墙</span>
          <span class="sceneDesc">灰砖锁边 · 底部密排竖砖</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="canPyramid" disabled>
          <span class="sceneName">罐金字塔</span>
          <span class="sceneDesc">地面罐堆<br>十二层金字塔</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="brickPile" disabled>
          <span class="sceneName">砖堆</span>
          <span class="sceneDesc">X / Z 长轴逐层交错<br>大长方体砖堆</span>
        </button>
        <button class="sceneBtn" type="button" data-scene="brickPillars" disabled>
          <span class="sceneName">砖柱</span>
          <span class="sceneDesc">双砖柱<br>交错叠高 · 间距拉大</span>
        </button>
      </div>
      <p class="foot"><em>R</em> 重置当前场景 · 左上角也有重置按钮</p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
